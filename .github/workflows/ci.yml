name: Pipeline CI

# Este pipeline se ejecuta cada vez que se hace un push a la rama main. 
on:
  push:
    branches:
      - main

jobs:
  # Se encarga de ejecutar los tests y construir el proyecto.
  test-and-build:
    # Crea una máquina virtual con Ubuntu 
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repo
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Instala node en la MV (misma versión que se usa en el proyecto)
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instala las dependencias del proyecto
      - name: Instalar dependencias
        run: npm install

      # Ejecutar el linter
      - name: Ejecutar linter
        run: npm run lint

      # Ejecuta los tests definidos en el proyecto
      - name: Ejecutar tests
        run: npm test
      
      # Construye el proyecto
      - name: Deploy en Render
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # Notificación de éxito
      - name: Notificar éxito en Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          payload=$(node -e 'console.log(JSON.stringify({ text: `✅ Pipeline exitoso\n\nUsuario: ${process.env.GITHUB_ACTOR}\nCommit: ${process.env.COMMIT_MESSAGE}` }))')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
  

      # Notificación de error
      - name: Notificar fallo en Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(node -e 'console.log(JSON.stringify({ text: `❌ Pipeline con fallo\n\nUsuario: ${process.env.GITHUB_ACTOR}\nCommit: ${process.env.COMMIT_MESSAGE}\n\nRevisar: ${process.env.RUN_URL}` }))')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
